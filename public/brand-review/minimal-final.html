<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小白看板 · 极简标识定稿</title><style>*{box-sizing:border-box}body{margin:0;padding:48px;background:#fff8f0;color:#2b2118;font:16px/1.7 system-ui,sans-serif}main{max-width:1040px;margin:auto}h1{font-size:32px;margin:0}p{color:#756454}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:32px 0}.panel{border:1px solid #ecd7c3;border-radius:24px;padding:32px;background:white}.dark{background:#191919;color:#fff}.row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}figure{margin:0;text-align:center}figcaption{font-size:12px;opacity:.65}svg{display:block}.spec{background:white;border-radius:20px;padding:24px}@media(max-width:700px){body{padding:24px}.grid{grid-template-columns:1fr}}</style><main><h1>小白看板 · 极简标识</h1><p>选定方向 A：开放的看板角标，承托一个完成标记。以下直接显示 SVG，不使用位图。</p><div class="grid" id="panels"></div><div class="spec"><b>精修内容</b><p>角标线宽 16，对勾线宽 24，让完成标记成为中心；统一圆角端点，收紧内部结构；四边保留 32 单位留白。</p><b>颜色来源</b><p>沿用现有品牌主色 #F5821F；实际图标浅底用 #D9690B，深底用 #FFA64D。透明背景，不加阴影或渐变。</p><b>理念与状态</b><p>把想法推进到完成。用户已选定极简方向，本次精修应用于网站导航和浏览器标签；原有四体系方案仍保留作对照。</p></div></main><script>const shape='<g fill="none" stroke="COLOR" stroke-linecap="round" stroke-linejoin="round"><path d="M40 96V64Q40 40 64 40H96M160 216H192Q216 216 216 192V160" stroke-width="16"/><path d="M76 128L112 164L180 88" stroke-width="24"/></g>';document.getElementById('panels').innerHTML=[false,true].map(d=>'<section class="panel '+(d?'dark':'')+'"><h2>'+(d?'深色背景':'浅色背景')+'</h2><div class="row">'+[32,64,160].map(n=>'<figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="'+n+'" height="'+n+'" role="img" aria-label="小白看板极简标识">'+shape.replace('COLOR',d?'#FFA64D':'#D9690B')+'</svg><figcaption>'+n+'px</figcaption></figure>').join('')+'</div></section>').join('');</script></html>
